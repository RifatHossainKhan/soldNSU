{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<form class="panel narrow" method="post">
  <h2>Create your account</h2>
  <p class="muted">One account lets you both buy and sell.</p>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Full name <input name="name" required></label>
  <label>Email <input type="email" name="email" required></label>
  <label>Password (6+ characters) <input type="password" name="password" minlength="6" required></label>
  <button class="btn">Sign up</button>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</form>
{% endblock %}
