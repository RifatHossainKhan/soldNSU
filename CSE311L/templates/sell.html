{% extends "base.html" %}
{% block title %}Sell Post{% endblock %}
{% block content %}
<form class="panel" method="post" enctype="multipart/form-data">
  <h2>Create a sell post</h2>
  <p class="muted">Add a photo, price and category. An admin approves the post before it goes live.</p>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Title <input name="title" value="{{ form.get('title','') }}" required></label>
  <label>Description <textarea name="description" rows="4">{{ form.get('description','') }}</textarea></label>
  <div class="row">
    <label>Price (৳) <input type="number" name="price" min="0" step="1" value="{{ form.get('price','') }}" required></label>
    <label>Category
      <select name="category">
        {% for c in categories %}<option {{ 'selected' if form.get('category') == c }}>{{ c }}</option>{% endfor %}
      </select>
    </label>
    <label>Segment
      <select name="segment">
        {% for key, label in SEGMENTS.items() %}
          <option value="{{ key }}" {{ 'selected' if form.get('segment') == key }}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <label>Photo <input type="file" name="photo" accept="image/*"></label>
  <button class="btn">Submit for approval</button>
</form>
{% endblock %}
