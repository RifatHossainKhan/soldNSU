{% extends "admin/layout.html" %}
{% block title %}Edit post{% endblock %}
{% block admin %}
<form class="panel" method="post">
  <h2>Edit post #{{ post.id }}</h2>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Title <input name="title" value="{{ post.title }}" required></label>
  <label>Description <textarea name="description" rows="4">{{ post.description }}</textarea></label>
  <div class="row">
    <label>Price (৳) <input type="number" name="price" min="0" step="1" value="{{ '%.0f'|format(post.price) }}" required></label>
    <label>Category
      <select name="category">{% for c in categories %}<option {{ 'selected' if post.category == c }}>{{ c }}</option>{% endfor %}</select>
    </label>
    <label>Segment
      <select name="segment">{% for key, label in SEGMENTS.items() %}<option value="{{ key }}" {{ 'selected' if post.segment == key }}>{{ label }}</option>{% endfor %}</select>
    </label>
  </div>
  <button class="btn">Save changes</button>
  <a class="btn ghost" href="{{ url_for('admin_posts') }}">Cancel</a>
</form>
{% endblock %}
